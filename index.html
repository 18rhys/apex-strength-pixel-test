<body>
  <h1>Apex Strength — Tracking Test</h1>

  <p>This is a fictional website for learning Meta Pixel.</p>
  <p>No real bookings or customer information are collected.</p>

  <p>Meta tracking is disabled until you explicitly agree.</p>

  <button id="enable-tracking">
    I agree — Enable Meta Pixel Test
  </button>

  <p id="status">Tracking disabled.</p>

  <script>
    document.getElementById('enable-tracking')
      .addEventListener('click', function () {

        // Meta Pixel loads only after explicit agreement.
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;
        n.version='2.0';n.queue=[];
        t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}
        (window,document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');

        fbq('init', '1915058596144178');
        fbq('track', 'PageView');

        document.getElementById('status').textContent =
          'Meta Pixel test activated. PageView event sent.';

        document.getElementById('enable-tracking').disabled = true;
      });
  </script>
</body>
